# T008 (ADR-011) — the 11 blocking gates from the constitution's
# "Development Workflow and Quality Gates" section. A red gate is never bypassed
# by merge override; it is fixed or the change is reverted.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks and the OpenAPI diff need history

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Gates 1-2: build + compile
      - name: Build
        run: ./gradlew assemble --no-daemon

      # Gate 3: architecture / dependency rule (Principle VII)
      - name: Architecture gate
        run: ./gradlew archTest --no-daemon

      # Gates 4-7: unit, contract, integration, privacy tests (Principle VI).
      # Testcontainers uses the runner's Docker daemon.
      - name: Tests
        run: ./gradlew test --no-daemon

      # Gate 8: the Principle V privacy scan, run as its own step so a leak is identifiable
      # at a glance in the CI log rather than buried among 180+ test results. Blocking:
      # the constitution names this a merge blocker.
      - name: Privacy gate (no content, credentials or unmasked recipients in audit or logs)
        run: ./gradlew privacyTest --no-daemon

      # Gate 9: coverage floors — 90% domain, 80% overall
      - name: Coverage floors
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      # Gate 10: secret scan (Principle V)
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate 11: dependency vulnerability audit.
      # A new high or critical advisory blocks the merge.
      - name: Dependency audit
        uses: dependency-check/Dependency-Check_Action@main
        env:
          # This action runs in a Docker container, but inherits JAVA_HOME from the job, where
          # setup-java pointed it at a host path under /opt/hostedtoolcache. That path does not exist
          # inside the container, so dependency-check aborted with "JAVA_HOME is not defined
          # correctly" before scanning anything. Clearing it lets the container use its own bundled
          # JDK. The failure looked like a vulnerability finding and was an environment fault.
          JAVA_HOME: ""
        with:
          project: notification-management-service
          path: "."
          format: "HTML"
          # One line, not a folded scalar. `>` produced a single argument with an embedded space and
          # a trailing newline — "--failOnCVSS 7 --enableExperimental\n" — rather than three
          # arguments, so the CVSS threshold would not have been applied even once Java was found.
          args: "--failOnCVSS 7 --enableExperimental"

      # Gate 12: OpenAPI breaking-change diff against the base branch
      - name: OpenAPI breaking-change diff
        if: github.event_name == 'pull_request'
        run: |
          git show origin/${{ github.base_ref }}:specs/001-notification-management-core/contracts/openapi.yaml \
            > /tmp/base-openapi.yaml 2>/dev/null || exit 0
          docker run --rm -v /tmp:/base -v "$PWD:/repo" tufin/oasdiff breaking \
            /base/base-openapi.yaml \
            /repo/specs/001-notification-management-core/contracts/openapi.yaml
