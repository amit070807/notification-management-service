# T004 — all credentials come from the environment. No secrets in source control.
spring:
  # .env is read by docker compose, but NOT by the JVM - so `./gradlew bootRun` would otherwise
  # start with an empty POSTGRES_PASSWORD and fail Flyway with "password authentication failed".
  # Importing it here makes the documented two-command flow work, and works for `java -jar` too.
  # `optional:` means a deployment that supplies real environment variables needs no .env at all.
  config:
    import: optional:file:.env[.properties]
  application:
    name: notification-management-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:notifications}
    username: ${POSTGRES_USER:notifications}
    password: ${POSTGRES_PASSWORD}
  # Optional response fields are omitted rather than serialised as null. The contract marks
  # lastFailureClassification and nextAttemptAt as optional, and a null does not satisfy an
  # enum schema — the contract test caught this.
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Constitution Declared Operating Defaults. These are constitutional defaults,
# not source requirements — the requirements document states no numbers (G-08).
notification:
  retry:
    max-attempts: 5
    base-delay: PT1S
    multiplier: 2
    ceiling: PT60S
    jitter-ratio: 0.2
  # T002 — feature flags (ADR-016, FR-104). ALL DEFAULT FALSE.
  #
  # FR-105: with every flag off, observable behaviour MUST be indistinguishable from the phase-1
  # baseline. That is what makes these a rollback mechanism rather than settings, and it is
  # verified by running the unmodified phase-1 suite against a flagged-off build.
  #
  # Rollback is NOT symmetric for dedup-submission: notifications suppressed while it was enabled
  # were never delivered and are not recoverable afterwards. Turning it off restores behaviour
  # going forward only (spec G-48).
  #
  # The push channel is absent here on purpose — it is switched by routing-policy.yaml's
  # per-channel `enabled` (ADR-017).
  features:
    dedup-submission: false
    dedup-delivery: false
    delivery-reclaim: false

  # T003 — deduplication boundary window (spec D14, FR-141b).
  # 24 hours is an engineering assumption, not a source requirement: neither requirements document
  # states a duration. Same class as the retry bounds (phase-1 G-08).
  #
  # Consequence worth knowing: a caller that legitimately repeats the same event within 24 hours
  # has the repeat suppressed. Under D9 event identifiers are unique per submitter so this cannot
  # arise, but a periodic job reusing one identifier is exactly how that contract gets broken.
  dedup:
    window: PT24H

  worker:
    poll-interval-ms: 1000
  channel:
    connect-timeout: PT5S
    read-timeout: PT10S
    # ADR-015 (U-5): simulated failures are configured, never carried in a request. Leave empty
    # for successful delivery; set fail-with to demonstrate any of the six classifications.
    # fail-first-attempts shows retry-then-success without a code change.
    simulate: {}
    #  EMAIL:
    #    fail-with: TRANSIENT_PROVIDER_FAILURE
    #    fail-first-attempts: 2
  content:
    max-payload-bytes: 65536
  routing:
    policy-location: classpath:routing-policy.yaml

logging:
  level:
    com.notification: INFO
