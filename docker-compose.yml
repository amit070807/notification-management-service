# T002 — PostgreSQL 16 for local runs (ADR-003).
# Credentials come from the environment; copy .env.example to .env before use.
services:
  postgres:
    image: postgres:16-alpine
    container_name: nms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      POSTGRES_USER: ${POSTGRES_USER:-notifications}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notifications}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nms-pgdata:
